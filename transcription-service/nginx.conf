# Nginx reverse proxy configuration for Shepherd AI Transcription Microservice
# Place this in /etc/nginx/sites-available/transcribe and symlink to /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name transcribe.yourdomain.com; # Replace with your subdomain or VM IP/domain

    client_max_body_size 25M;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep timeouts generous for longer voice note transcriptions
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
